services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradingengine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports: ["55432:5432"]
    volumes: ["trading-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradingengine"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["trading-redis:/data"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: src/TradingEngine.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TradingDb: Host=postgres;Port=5432;Database=tradingengine;Username=postgres;Password=${POSTGRES_PASSWORD:-local-dev-only}
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-compose-only-secret-change-before-use-2026}
      Cors__Origins__0: http://localhost:5173
    ports: ["5000:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  trading-db:
  trading-redis:
